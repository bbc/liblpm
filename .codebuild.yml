version: 0.2
phases:
  install:
    commands:
      - certee-fetch
  pre_build:
    commands:
      - cd pkg
      - cp Makefile.bidi Makefile
      - RELEASE="$(grep CPE_NAME /etc/os-release | sed 's/[^0-9]//g')"
  build:
    on-failure: ABORT
    commands:
      - make prepare
      - mock-build --os ${RELEASE}
  post_build:
    on-failure: ABORT
    commands:
      - |-
        if [[ "${MD_ENVIRONMENT}" == "live" ]] ; then
            for rpm in $(ls ./RPMS/liblpm-*.rpm)
            do
                repo upload ${rpm} md-el${RELEASE}/revisions/head
            done
        fi
